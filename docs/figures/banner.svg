<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">NeuroVista AI</title>
  <desc id="d">Animated banner: a scan line sweeps across a stylised axial brain outline beside the title NeuroVista AI, brain tumor segmentation research platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060d1c"/><stop offset="1" stop-color="#0f2342"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.55"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
    <clipPath id="brain"><ellipse cx="190" cy="160" rx="105" ry="122"/></clipPath>
    <clipPath id="type"><rect x="380" y="120" width="560" height="70"><animate attributeName="width" from="0" to="560" dur="2.4s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1b3358" stroke-width="0.6"/></pattern>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.6"/>
  <g>
    <ellipse cx="190" cy="160" rx="112" ry="130" fill="none" stroke="#7aa2d6" stroke-width="6" opacity="0.45"/>
    <ellipse cx="190" cy="160" rx="105" ry="122" fill="#16294a"/>
    <path d="M190 45 C182 100 198 120 190 160 C182 200 198 220 190 275" stroke="#0a1428" stroke-width="4" fill="none"/>
    <g clip-path="url(#brain)">
      <ellipse cx="228" cy="128" rx="34" ry="30" fill="#f5c542" opacity="0.55"/>
      <ellipse cx="228" cy="128" rx="21" ry="19" fill="#ef4444" opacity="0.6"/>
      <ellipse cx="228" cy="128" rx="9" ry="8" fill="#3b82f6" opacity="0.8"/>
      <rect x="-60" y="0" width="60" height="320" fill="url(#scan)"><animate attributeName="x" values="85;295;85" dur="5s" repeatCount="indefinite"/></rect>
    </g>
  </g>
  <g clip-path="url(#type)">
    <text x="380" y="178" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#e8f1ff">NeuroVista <tspan fill="#8b7cf6">AI</tspan></text>
  </g>
  <text x="382" y="222" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#5eead4">Multi-modal brain tumor segmentation with measurable confidence</text>
  <text x="382" y="258" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#8aa3c7">U-Net · uncertainty · patient-level evaluation · research use only</text>
  <circle cx="1130" cy="40" r="5" fill="#22d3ee"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
</svg>
