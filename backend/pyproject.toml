[project]
name = "neurovista"
version = "0.1.0"
description = "NeuroVista AI - brain tumor segmentation research platform (research use only)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::PendingDeprecationWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E702", "E701", "B008", "UP037", "B904", "E741"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "F841"]
